name: Mining v49 inspect

on:
  push:
    branches: [main]
    paths:
      - inspect-trigger.txt

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Mining v49 state
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request
          url = "https://card.dev-lookin.ru/mineFeature"
          req = urllib.request.Request(url, headers={"Accept":"application/json","User-Agent":"card-public-mining-inspect/1.0"})
          with urllib.request.urlopen(req, timeout=30) as response:
              data = json.loads(response.read().decode("utf-8"))
          if data.get("ok") is not True:
              raise SystemExit(data.get("error") or "inspect failed")
          state = data.get("state") or {}
          print(json.dumps({
              "version44": state.get("version44"),
              "version45": state.get("version45"),
              "version49": state.get("version49"),
              "tables": state.get("tables"),
              "mining_profile": state.get("mining_profile"),
              "mining_scaling": state.get("mining_scaling"),
              "mining_pool_count": len(state.get("mining_pool") or []),
              "mining_locations_count": len(state.get("mining_locations") or []),
              "mining_attributes": sorted((state.get("mining_attributes") or {}).keys()),
              "mine_vein_event_count": sum(1 for k in (state.get("events") or {}) if str(k).startswith("mine_ore_vein_"))
          }, ensure_ascii=False, indent=2))
          PY

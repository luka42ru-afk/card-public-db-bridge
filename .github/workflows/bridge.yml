name: Public bridge

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Bridge mode
        required: true
        type: choice
        options:
          - read
          - write

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run bridge
        env:
          BRIDGE_CONFIG: ${{ secrets.BRIDGE_CONFIG }}
          BRIDGE_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [ -z "$BRIDGE_CONFIG" ]; then
            echo "::error::Bridge configuration is not available"
            exit 1
          fi
          python3 bridge.py "$BRIDGE_MODE"

name: Public bridge

on:
  push:
    branches: [main]
    paths:
      - command.json
  workflow_dispatch:
    inputs:
      mode:
        description: Bridge mode
        required: true
        type: choice
        options:
          - deploy
          - operate
          - inspect_ftp

permissions:
  contents: read
  statuses: write

concurrency:
  group: public-bridge
  cancel-in-progress: true

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
          else
            MODE="$(python3 -c "import json; print(json.load(open('command.json', encoding='utf-8')).get('mode',''))")"
          fi
          if [ "$MODE" != "deploy" ] && [ "$MODE" != "operate" ] && [ "$MODE" != "inspect_ftp" ]; then
            echo "::error::Unsupported bridge mode"
            exit 1
          fi
          echo "value=$MODE" >> "$GITHUB_OUTPUT"

      - name: Run bridge
        env:
          BRIDGE_CONFIG: ${{ secrets.BRIDGE_CONFIG }}
          BRIDGE_MODE: ${{ steps.mode.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$BRIDGE_CONFIG" ]; then
            echo "::error::Bridge configuration is not available"
            exit 1
          fi
          python3 bridge.py "$BRIDGE_MODE"

      - name: Record generic bridge outcome
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRIDGE_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=failure
          if [ "$BRIDGE_JOB_STATUS" = "success" ]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context="card-public-bridge" -f description="Bridge completed: $state"
